baseURL = 'https://castellaq.github.io/'
languageCode = 'ko-kr'
title = '민수의 테크 육아'
theme = 'PaperMod'

[params]
  description = "30대 아빠의 AI 육아 블로그"
  author = "윤민수"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true

  [params.homeInfoParams]
    Title = "안녕하세요! 👋"
    Content = "30대 아빠 윤민수입니다. 9개월 된 딸 윤서하를 키우면서 AI와 테크를 활용한 육아 경험을 공유합니다."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/castellaq"

[menu]
  [[menu.main]]
    name = "홈"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "글"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "태그"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    name = "소개"
    url = "/about/"
    weight = 4

[outputs]
  home = ["HTML", "RSS", "JSON"]
